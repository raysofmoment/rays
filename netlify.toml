[build]
  command = "npm run build"
  publish = "dist"

# PROXY RULE: Route all backend /api/ traffic to your live backend server
[[redirects]]
  from = "/api/*"
  # This routes backend traffic from Netlify to your AI Studio Cloud Run server
  to = "https://ais-pre-t3gs7beuood4vbvsvwufg3-435864974997.asia-southeast1.run.app/api/:splat"
  status = 200
  force = true
  
# SPA RULE: Catch-all rule for React Router (Keep this at the bottom!)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
